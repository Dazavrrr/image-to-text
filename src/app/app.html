<main class="converter">
  <header class="header">
    <h1>Image to Text Converter</h1>

    <p>Convert your images into copyable text.</p>
  </header>

  <section class="panel">
    <label class="upload">
      <span>Choose an image</span>
      <small>JPEG or PNG · Up to 2 MB</small>

      <input type="file" accept="image/jpeg,image/png" [disabled]="isLoading()" (change)="onFileSelected($event)" />
    </label>

    @if (previewUrl()) {
    <div class="preview">
      <img [src]="previewUrl()" alt="Uploaded image preview" />
      <small>{{ selectedFile()?.name }}</small>
    </div>
    }

    <button class="primary" [disabled]="!selectedFile() || isLoading()" (click)="extractText()">
      {{ isLoading() ? 'Extracting text...' : 'Extract text' }}
    </button>

    @if (error()) {
    <p class="error" role="alert">{{ error() }}</p>
    }
  </section>

  <section class="panel">
    <div class="result-header">
      <h2>Extracted text</h2>

      <button class="secondary" [disabled]="!extractedText()" (click)="copyText()">
        {{ isCopied() ? 'Copied!' : 'Copy text' }}
      </button>
    </div>

    <textarea readonly aria-label="Extracted text" placeholder="Your extracted text will appear here..."
      [value]="extractedText()"></textarea>
  </section>
</main>
